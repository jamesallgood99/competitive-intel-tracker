name: Test

on:
  pull_request:
  push:
    branches: [main]
    paths: ['src/**', 'site/**', 'test/**', 'config/**', 'data/competitors/**']

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - run: npm test
