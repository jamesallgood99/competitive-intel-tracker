name: Weekly competitor scan

# Mondays at 14:17 UTC. The first run each month also refreshes customer and employee reviews.
on:
  schedule:
    - cron: '17 14 * * 1'
  workflow_dispatch:
    inputs:
      slug:
        description: 'One competitor (leave blank for all)'
        required: false
      with_reviews:
        description: 'Refresh reviews too'
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: knowledge-base-writes
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Scan approved sources
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
        run: |
          ARGS=""
          if [ -n "${{ inputs.slug }}" ]; then ARGS="$ARGS --slug ${{ inputs.slug }}"; fi
          if [ "${{ inputs.with_reviews }}" = "true" ] || [ "$(date -u +%d)" -le 7 ]; then ARGS="$ARGS --with-reviews"; fi
          node src/jobs/scrape.js $ARGS
      - name: Commit changes
        run: |
          git config user.name "intel-tracker[bot]"
          git config user.email "intel-tracker@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Weekly competitor scan $(date -u +%F)"
          git pull --rebase && git push
      - name: Rebuild the site
        # Commits pushed with the Actions token don't trigger other workflows, so start the build directly.
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
