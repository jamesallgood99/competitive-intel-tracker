name: Draft a new battlecard

# Started by the Slack bot when the admin approves a battlecard request (or by hand).
# Opens a pull request; merging it publishes the card and announces it in Slack.
on:
  workflow_dispatch:
    inputs:
      slug:
        description: 'Competitor slug (the bot creates data/competitors/<slug>.json first)'
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Scrape approved sources and draft the card
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
        run: node src/jobs/draft-card.js --slug "${{ inputs.slug }}"
      - name: Open a pull request for review
        env:
          GH_TOKEN: ${{ github.token }}
          SLUG: ${{ inputs.slug }}
        run: |
          BRANCH="battlecard/$SLUG"
          git config user.name "intel-tracker[bot]"
          git config user.email "intel-tracker@users.noreply.github.com"
          git checkout -b "$BRANCH"
          # Merging the PR is the admin's approval, so the card goes live as active.
          node -e "const f='data/competitors/'+process.env.SLUG+'.json';const fs=require('fs');const c=JSON.parse(fs.readFileSync(f));c.status='active';c.lastConfirmed=new Date().toISOString().slice(0,10);fs.writeFileSync(f,JSON.stringify(c,null,2)+'\n')"
          git add data
          git commit -m "Draft battlecard: $SLUG"
          git push -u origin "$BRANCH"
          NAME=$(node -p "require('./data/competitors/$SLUG.json').name")
          gh pr create --title "New battlecard: $NAME" --body "Claude drafted this from the sources you approved in Slack. Check the positioning statement, the quick-look scorecard and the objections, edit anything here, then merge to publish. Merging announces it in Slack.

          Preview the data: \`data/competitors/$SLUG.json\`"
